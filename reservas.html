<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reserva tu experiencia con Rueda Libre.">
  <title>Reservas | Rueda Libre</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-white text-gray-800">
  <a href="#contenido"
     class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 bg-yellow-300 p-2 rounded">
    Saltar al contenido
  </a>

  <header class="bg-gray-900 text-white p-4">
    <h1 class="text-2xl font-bold">Rueda Libre</h1>
    <nav aria-label="Navegación principal">
      <ul class="flex gap-4 mt-2">
        <li><a class="underline focus:outline-2 focus:outline-yellow-300" href="index.html">Inicio</a></li>
        <li><a class="underline focus:outline-2 focus:outline-yellow-300" href="rutas.html">Rutas</a></li>
        <li><a class="underline focus:outline-2 focus:outline-yellow-300" href="reservas.html" aria-current="page">Reservas</a></li>
      </ul>
    </nav>
  </header>

  <main id="contenido">
    <form action="#" method="post"
          class="bg-gray-100 p-4 rounded shadow-md max-w-md mx-auto mt-8">
      <h2 class="text-xl font-semibold mb-4">Formulario de reserva</h2>

      <div class="mb-4">
        <label for="nombre" class="block text-gray-700">Nombre:</label>
        <input type="text" id="nombre" name="nombre"
               required minlength="3" autocomplete="name"
               class="w-full border border-gray-300 p-2 rounded focus:outline-2 focus:outline-blue-500">
      </div>

      <div class="mb-4">
        <label for="email" class="block text-gray-700">Email:</label>
        <input type="email" id="email" name="email"
               required autocomplete="email"
               class="w-full border border-gray-300 p-2 rounded focus:outline-2 focus:outline-blue-500">
      </div>

      <div class="mb-4">
        <label for="fecha" class="block text-gray-700">Fecha de la reserva:</label>
        <input type="date" id="fecha" name="fecha" required
               class="w-full border border-gray-300 p-2 rounded focus:outline-2 focus:outline-blue-500">
      </div>

      <div class="mb-4">
        <label for="mensaje" class="block text-gray-700">Detalles:</label>
        <textarea id="mensaje" name="mensaje" rows="4" maxlength="300"
                  aria-describedby="ayuda-mensaje"
                  class="w-full border border-gray-300 p-2 rounded focus:outline-2 focus:outline-blue-500"
                  placeholder="Especificaciones para su comodidad"></textarea>
        <p id="ayuda-mensaje" class="text-sm text-gray-600">Máximo 300 caracteres.</p>
      </div>

      <button type="submit"
              class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 focus:outline-2 focus:outline-offset-2 focus:outline-blue-500">
        Enviar
      </button>
    </form>
  </main>

  <footer class="text-center p-4 mt-8 text-gray-600">
    <p>&copy; 2026 Rueda Libre. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
