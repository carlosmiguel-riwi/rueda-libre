<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reserva tu experiencia con Rueda Libre.">
  <title>Reservas | Rueda Libre</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="bg-white text-dark">
  <!-- Enlace de salto de accesibilidad -->
  <a href="#contenido" class="visually-hidden-focusable position-absolute top-0 start-0 m-2 bg-warning text-dark p-2 rounded text-decoration-none fw-bold">
    Saltar al contenido
  </a>

  <!-- Encabezado y Navegación -->
  <header class="bg-dark text-white p-3">
    <div class="container">
      <h1 class="h2 fw-bold mb-2">Rueda Libre</h1>
      <nav aria-label="Navegación principal">
        <ul class="nav gap-3">
          <li class="nav-item">
            <a class="nav-link text-white text-decoration-underline p-0" href="index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white text-decoration-underline p-0" href="rutas.html">Rutas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white text-decoration-underline p-0" href="reservas.html" aria-current="page">Reservas</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main id="contenido" class="container my-5" style="max-width: 500px;">
    
    <!-- Formulario de Reserva -->
    <form action="#" method="post" class="bg-light p-4 rounded shadow-sm border">
      <h2 class="h4 fw-semibold mb-4 text-center">Formulario de reserva</h2>

      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre:</label>
        <input type="text" id="nombre" name="nombre"
               required minlength="3" autocomplete="name"
               class="form-control">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" id="email" name="email"
               required autocomplete="email"
               class="form-control">
      </div>

      <div class="mb-3">
        <label for="fecha" class="form-label">Fecha de la reserva:</label>
        <input type="date" id="fecha" name="fecha" required
               class="form-control">
      </div>

      <div class="mb-3">
        <label for="mensaje" class="form-label">Detalles:</label>
        <textarea id="mensaje" name="mensaje" rows="4" maxlength="300"
                  aria-describedby="ayuda-mensaje"
                  class="form-control"
                  placeholder="Especificaciones para su comodidad"></textarea>
        <div id="ayuda-mensaje" class="form-text">Máximo 300 caracteres.</div>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" class="btn btn-primary py-2">
          Enviar
        </button>
      </div>
    </form>

  </main>

  <!-- Pie de página -->
  <footer class="text-center p-4 mt-5 text-muted border-top">
    <p class="mb-0">&copy; 2026 Rueda Libre. Todos los derechos reservados.</p>
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
