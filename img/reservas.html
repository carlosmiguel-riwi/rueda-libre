<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu Bicicleta - Rueda Libre</title>
</head>
<body>

    <header>
        <h1>Rueda Libre</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reservas.html">Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Formulario de reserva</h2>

            <form action="procesar_reserva.php" method="post">

                <fieldset>
                    <legend>Tus datos</legend>

                    <p>
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </p>

                    <p>
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="telefono">Teléfono de contacto:</label>
                        <input type="tel" id="telefono" name="telefono" required>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Tu alquiler</legend>

                    <p>
                        <label for="fecha_inicio">Fecha de inicio:</label>
                        <input type="date" id="fecha_inicio" name="fecha_inicio" required>
                    </p>
                    <p>
                        <label for="punto_recogida">Punto de recogida:</label>
                        <select id="punto_recogida" name="punto_recogida" required>
                            <option value="">-- Selecciona una sede --</option>
                            <option value="centro">Parque La Estrella</option>
                            <option value="norte">Centro Comercial Monterrey</option>
                            <option value="costanera">Centro Comercial Outlet Moda</option>
                        </select>
                    </p>

                    <fieldset>
                        <legend>Tipo de bicicleta:</legend>
                        <p>
                            <input type="radio" id="bici_urbana" name="tipo_bicicleta" value="urbana" checked>
                            <label for="bici_urbana">Urbana</label>
                        </p>
                        <p>
                            <input type="radio" id="bici_montana" name="tipo_bicicleta" value="montana">
                            <label for="bici_montana">Montaña (MTB)</label>
                        </p>
                        <p>
                            <input type="radio" id="bici_electrica" name="tipo_bicicleta" value="electrica">
                            <label for="bici_electrica">Eléctrica</label>
                        </p>
                    </fieldset>
                </fieldset>

                <fieldset>
                    <legend>Confirmación</legend>

                    <p>
                        <label for="comentarios">Comentarios o solicitudes especiales:</label><br>
                        <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="Ej. Talla de casco deseada, silla de bebé, etc."></textarea>
                    </p>


                </fieldset>

                <br>
                <button type="submit">Confirmar Reserva</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rueda Libre. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
