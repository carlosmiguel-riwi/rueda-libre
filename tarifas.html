<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulta nuestras tarifas de alquiler de bicicletas en Rueda Libre.">
  <title>Tarifas | Rueda Libre</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Tu hoja de estilos personalizada -->
  <link href="css/styles.css" rel="stylesheet">
</head>

<body class="bg-white text-dark">
  <!-- Encabezado y Navegación -->
  <header class="bg-dark text-white p-3">
    <div class="container">
      <h1 class="h2 fw-bold mb-2">Rueda Libre</h1>
      <nav aria-label="Navegación principal">
        <ul class="nav gap-3">
          <li class="nav-item">
            <a class="nav-link text-white text-decoration-underline p-0" href="index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white text-decoration-underline p-0" href="reservas.html">Reservas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white text-decoration-underline p-0" href="tarifas.html" aria-current="page">Tarifas</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main id="contenido" class="container my-5" style="max-width: 768px;">
    <section aria-labelledby="titulo-tarifas" class="card shadow-sm">
      <div class="card-header bg-light py-3">
        <h2 id="titulo-tarifas" class="h4 fw-semibold mb-0">Tarifas de alquiler</h2>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-bordered table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th scope="col">Tipo de bicicleta</th>
                <th scope="col">1 hora</th>
                <th scope="col">Medio día (4 h)</th>
                <th scope="col">Día completo</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="fw-medium">Urbana</td>
                <td>$10.000</td>
                <td>$30.000</td>
                <td>$50.000</td>
              </tr>
              <tr>
                <td class="fw-medium">Montaña</td>
                <td>$15.000</td>
                <td>$45.000</td>
                <td>$70.000</td>
              </tr>
              <tr>
                <td class="fw-medium">Eléctrica</td>
                <td>$25.000</td>
                <td>$70.000</td>
                <td>$110.000</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <div class="mt-4 text-end">
      <a href="reservas.html" class="btn btn-primary px-4">Reservar bicicleta</a>
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="text-center p-4 mt-5 text-muted border-top">

  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
